<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>匹克球課堂點名系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen pb-12">
    <div class="max-w-md mx-auto bg-white min-h-screen shadow-lg flex flex-col">
        
        <!-- 頂部標題 -->
        <div class="bg-green-600 text-white p-4 text-center font-bold text-xl shadow">
            🎾 匹克球課堂點名
        </div>

        <!-- 表單與內容區 -->
        <div class="p-4 flex-1 space-y-4">
            
            <!-- 上課日期 -->
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-1">上課日期：</label>
                <input type="date" id="classDate" onchange="filterSchedule()" class="w-full border rounded-lg p-2.5 bg-gray-50 focus:ring-2 focus:ring-green-500 outline-none">
            </div>

            <!-- 上課時段 (動態從 Schedule 讀取) -->
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-1">上課時段：</label>
                <select id="timeSlotSelect" onchange="renderStudentList()" class="w-full border rounded-lg p-2.5 bg-gray-50 focus:ring-2 focus:ring-green-500 outline-none font-medium">
                    <option value="">請先選擇日期與時段</option>
                </select>
            </div>

            <!-- 當日教學簡述 -->
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-1">當日教學簡述：</label>
                <input type="text" id="teachingSummary" placeholder="例如：正手拍基礎、底線抽球" class="w-full border rounded-lg p-2.5 bg-gray-50 focus:ring-2 focus:ring-green-500 outline-none">
            </div>

            <!-- 教練其他備註 -->
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-1">教練其他備註（選填）：</label>
                <textarea id="classNote" rows="2" placeholder="學員狀況或場地備註..." class="w-full border rounded-lg p-2.5 bg-gray-50 focus:ring-2 focus:ring-green-500 outline-none"></textarea>
            </div>

            <hr class="my-2">

            <!-- 學員清單標題 -->
            <div class="flex justify-between items-center">
                <span class="font-bold text-gray-800 text-lg">該時段學員點名清單</span>
                <span id="loadingText" class="text-xs text-gray-400">載入中...</span>
            </div>

            <!-- 學員清單容器 -->
            <div id="studentList" class="space-y-3">
                <p class="text-center text-gray-400 py-4">請選擇日期與時段以顯示學員</p>
            </div>
        </div>

        <!-- 底部固定送出按鈕 -->
        <div class="p-4 bg-white border-t sticky bottom-0 shadow-inner">
            <button onclick="submitAttendance()" id="submitBtn" class="w-full bg-green-600 text-white font-bold py-3.5 rounded-xl hover:bg-green-700 transition shadow-md">
                確認送出點名
            </button>
        </div>

    </div>

    <script>
        // 🛑 請確認這裡的 GAS 網址是否正確
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwVA2usi9g9Nl62yIng7J87WHEqPnH0FOUSSp3wDaB-EUQLJVFUgCnY7QmuTRIwylpI/exec";

        let globalData = null;

        window.onload = function() {
            document.getElementById('classDate').valueAsDate = new Date();
            fetchData();
        };

        // 從後端取得所有資料
        function fetchData() {
            const loadingText = document.getElementById('loadingText');
            loadingText.innerText = "資料載入中...";

            fetch(GAS_URL)
                .then(res => res.json())
                .then(data => {
                    globalData = data;
                    loadingText.innerText = "資料已同步";
                    filterSchedule(); // 載入後自動依據預設日期篩選時段
                })
                .catch(err => {
                    console.error(err);
                    loadingText.innerText = '載入失敗';
                });
        }

        // 當日期改變時，自動更新「時段選項」
        function filterSchedule() {
            if (!globalData) return;
            const selectedDate = document.getElementById('classDate').value;
            const timeSlotSelect = document.getElementById('timeSlotSelect');
            
            const matchedSchedules = globalData.schedule.filter(item => {
                const itemDate = String(item.上課日期).split('T')[0];
                return itemDate === selectedDate;
            });

            timeSlotSelect.innerHTML = '<option value="">-- 請選擇上課時段 --</option>';
            
            const uniqueTimeSlots = [...new Set(matchedSchedules.map(item => item.時段))];
            
            uniqueTimeSlots.forEach(slot => {
                if (slot !== undefined && slot !== null && slot !== '') {
                    timeSlotSelect.innerHTML += `<option value="${slot}">${slot}</option>`;
                }
            });

            document.getElementById('studentList').innerHTML = `<p class="text-center text-gray-400 py-4">請選擇上課時段</p>`;
        }

        // 當選擇時段後，渲染該時段的學員名單（包含智慧決策面板：上次進度與備忘）
        function renderStudentList() {
            if (!globalData) return;
            const selectedDate = document.getElementById('classDate').value;
            const selectedTimeSlot = document.getElementById('timeSlotSelect').value;
            const listContainer = document.getElementById('studentList');

            if (!selectedTimeSlot) {
                listContainer.innerHTML = `<p class="text-center text-gray-400 py-4">請選擇上課時段</p>`;
                return;
            }

            const matchedStudents = globalData.schedule.filter(item => {
                const itemDate = String(item.上課日期).split('T')[0];
                return itemDate === selectedDate && String(item.時段) === String(selectedTimeSlot);
            });

            if (matchedStudents.length === 0) {
                listContainer.innerHTML = `<p class="text-center text-gray-400 py-4">此時段沒有排課學員</p>`;
                return;
            }

            listContainer.innerHTML = '';

            matchedStudents.forEach(scheduleItem => {
                const studentInfo = globalData.students.find(s => String(s.學員ID) === String(scheduleItem.學員ID)) || { 購買堂數: 0, 已上堂數: 0 };
                
                const total = Number(studentInfo.購買堂數) || 0;
                const used = Number(studentInfo.已上堂數) || 0;
                const remaining = total - used;
                
                // 取得該學員最近一次的歷史紀錄與備忘
                const lastLesson = globalData.lastLessons[scheduleItem.姓名] || { date: "無", summary: "尚無上課紀錄", note: "" };
                
                const badgeColor = remaining <= 2 ? 'text-red-500 bg-red-50 border-red-200' : 'text-gray-500 bg-gray-50 border-gray-200';

                // 組裝教練備忘顯示邏輯
                let noteHtml = lastLesson.note ? `<div class="text-xs text-amber-700 bg-amber-50 px-2 py-0.5 rounded border border-amber-200 mt-1">📝 備忘：${lastLesson.note}</div>` : '';

                listContainer.innerHTML += `
                    <div class="p-3 bg-white rounded-xl border border-gray-200 shadow-sm space-y-2">
                        <div class="flex items-center justify-between">
                            <div>
                                <div class="font-bold text-gray-800 text-base">${scheduleItem.姓名}</div>
                                <div class="text-xs px-2 py-0.5 rounded-md inline-block mt-0.5 border ${badgeColor}">
                                    剩餘堂數: ${remaining} (已上: ${used})
                                </div>
                            </div>
                            <div>
                                <select data-id="${scheduleItem.學員ID}" data-name="${scheduleItem.姓名}" class="attendance-status border border-gray-300 rounded-lg p-2 bg-gray-50 font-medium text-sm focus:ring-2 focus:ring-green-500 outline-none">
                                    <option value="Present" selected>🟢 到班</option>
                                    <option value="Absent">🔴 缺席</option>
                                </select>
                            </div>
                        </div>
                        
                        <!-- 💡 智慧決策面板：一眼看見上次上課進度與教練備忘 -->
                        <div class="bg-blue-50 border border-blue-100 rounded-lg p-2 text-xs space-y-1">
                            <div class="text-blue-800 font-medium">
                                📌 上次進度 (${lastLesson.date})：${lastLesson.summary}
                            </div>
                            ${noteHtml}
                        </div>
                    </div>
                `;
            });
        }

        // 送出點名
        function submitAttendance() {
            const date = document.getElementById('classDate').value;
            const timeSlot = document.getElementById('timeSlotSelect').value;
            const teachingSummary = document.getElementById('teachingSummary').value;
            const note = document.getElementById('classNote').value;
            const selects = document.querySelectorAll('.attendance-status');
            const submitBtn = document.getElementById('submitBtn');

            if (!date || !timeSlot) {
                alert('請完整選擇上課日期與時段！');
                return;
            }

            if (!teachingSummary) {
                alert('請填寫當日教學簡述！');
                return;
            }

            if (selects.length === 0) {
                alert('目前沒有可點名的學員！');
                return;
            }

            let attendanceData = [];
            selects.forEach(sel => {
                attendanceData.push({
                    studentId: sel.getAttribute('data-id'),
                    name: sel.getAttribute('data-name'),
                    status: sel.value
                });
            });

            submitBtn.disabled = true;
            submitBtn.innerText = '正在送出並更新堂數...';

            fetch(GAS_URL, {
                method: 'POST',
                body: JSON.stringify({ 
                    date: date, 
                    timeSlot: timeSlot,
                    teachingSummary: teachingSummary, 
                    note: note, 
                    attendance: attendanceData 
                })
            })
            .then(res => res.json())
            .then(res => {
                if(res.status === 'success') {
                    alert('🎉 點名成功！學員堂數已自動更新。');
                    location.reload();
                } else {
                    alert('送出發生錯誤：' + res.message);
                    submitBtn.disabled = false;
                    submitBtn.innerText = '確認送出點名';
                }
            })
            .catch(err => {
                console.error(err);
                alert('連線失敗，請檢查網路！');
                submitBtn.disabled = false;
                submitBtn.innerText = '確認送出點名';
            });
        }
    </script>
</body>
</html>
