<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>功能選單 - 匹克球場館</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-6 space-y-6">
        
        <div class="text-center space-y-1">
            <div class="text-3xl">🎾</div>
            <h1 class="text-xl font-bold text-gray-800">匹克球場館管理中心</h1>
            <p id="welcomeText" class="text-xs text-gray-400">載入權限中...</p>
        </div>

        <div id="menuContainer" class="space-y-4">
            <!-- 按鈕會依據權限自動長出來 -->
        </div>

        <div class="text-center pt-2">
            <a href="login.html" onclick="localStorage.clear()" class="text-xs text-gray-400 hover:text-red-500 transition">登出系統</a>
        </div>

    </div>

    <script>
        window.onload = function() {
            const role = localStorage.getItem('userRole');
            const username = localStorage.getItem('username') || '訪客';
            const menuContainer = document.getElementById('menuContainer');
            const welcomeText = document.getElementById('welcomeText');

            if (!role) {
                window.location.href = "login.html";
                return;
            }

            welcomeText.innerText = `歡迎回來，${username} (${getRoleName(role)})`;

            let htmlContent = '';

            // 如果是場館、管理員，或是角色未定義（為了避免畫面空白先全部顯示）
            if (role === 'venue' || role === 'admin' || role === '使用者' || !role) {
                htmlContent += `
                    <a href="register_2.html" class="block p-5 bg-blue-50 border border-blue-200 rounded-2xl hover:bg-blue-100 transition shadow-sm">
                        <div class="flex items-center space-x-4">
                            <div class="text-3xl bg-blue-600 text-white p-3 rounded-xl">🧑‍💼</div>
                            <div>
                                <div class="font-bold text-blue-900 text-lg">場館人員專用</div>
                                <div class="text-xs text-blue-600">學員報名、購買堂數與建檔</div>
                            </div>
                        </div>
                    </a>
                `;
            }

            if (role === 'coach' || role === 'admin' || role === '使用者' || !role) {
                htmlContent += `
                    <a href="coach.html" class="block p-5 bg-green-50 border border-green-200 rounded-2xl hover:bg-green-100 transition shadow-sm">
                        <div class="flex items-center space-x-4">
                            <div class="text-3xl bg-green-600 text-white p-3 rounded-xl">🎾</div>
                            <div>
                                <div class="font-bold text-green-900 text-lg">教練專用</div>
                                <div class="text-xs text-green-600">課堂點名、進度記錄與備忘</div>
                            </div>
                        </div>
                    </a>
                `;
            }

            menuContainer.innerHTML = htmlContent;
        };

        function getRoleName(role) {
            if (role === 'venue') return '場館人員';
            if (role === 'coach') return '教練';
            if (role === 'admin') return '系統管理者';
            return '使用者';
        }
    </script>
</body>
</html>
