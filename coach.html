<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登入系統 - 匹克球場館</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 space-y-6">
        <div class="text-center space-y-2">
            <div class="text-4xl">🎾</div>
            <h1 class="text-2xl font-bold text-gray-800">匹克球場館管理系統</h1>
            <p class="text-sm text-gray-500">請輸入您的帳號與密碼</p>
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-1">帳號：</label>
                <input type="text" id="accountInput" placeholder="請輸入帳號" class="w-full border rounded-xl p-3 bg-gray-50 focus:ring-2 focus:ring-green-500 outline-none">
            </div>
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-1">密碼：</label>
                <input type="password" id="passwordInput" placeholder="請輸入密碼" class="w-full border rounded-xl p-3 bg-gray-50 focus:ring-2 focus:ring-green-500 outline-none">
            </div>
            
            <button onclick="handleLogin()" id="loginBtn" class="w-full bg-green-600 text-white font-bold py-3.5 rounded-xl hover:bg-green-700 transition shadow-md">
                登入系統
            </button>
            <p id="errorMsg" class="text-center text-red-500 text-xs hidden">帳號或密碼錯誤！</p>
        </div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwVA2usi9g9Nl62yIng7J87WHEqPnH0FOUSSp3wDaB-EUQLJVFUgCnY7QmuTRIwylpI/exec";

        function handleLogin() {
            const account = document.getElementById('accountInput').value;
            const password = document.getElementById('passwordInput').value;
            const loginBtn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('errorMsg');

            if (!account || !password) {
                alert('請完整輸入帳號與密碼！');
                return;
            }

            loginBtn.disabled = true;
            loginBtn.innerText = '登入驗證中...';
            errorMsg.classList.add('hidden');

            fetch(GAS_URL, {
                method: 'POST',
                body: JSON.stringify({ 
                    action: 'login',
                    account: account,
                    password: password 
                })
            })
            .then(res => res.json())
            .then(res => {
                if (res.status === 'success') {
                    localStorage.setItem('userRole', res.role);
                    localStorage.setItem('username', account);
                    window.location.href = "index.html";
                } else {
                    errorMsg.classList.remove('hidden');
                    loginBtn.disabled = false;
                    loginBtn.innerText = '登入系統';
                }
            })
            .catch(err => {
                console.error(err);
                alert('連線失敗，請檢查網路或部署網址！');
                loginBtn.disabled = false;
                loginBtn.innerText = '登入系統';
            });
        }
    </script>
</body>
</html>
