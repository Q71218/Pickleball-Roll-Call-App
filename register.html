<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>場館人員專用 - 學員管理與多堂排課系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-8">
    <div class="max-w-3xl mx-auto space-y-6">
        
        <!-- 頁首標題 -->
        <div class="bg-white rounded-2xl shadow-md p-6 flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold text-gray-800">🧑‍💼 場館人員專用系統</h1>
                <p class="text-xs text-gray-500">學員建檔、多堂排課與堂數追蹤</p>
            </div>
            <a href="index.html" class="text-xs text-blue-600 hover:underline">← 回主選單</a>
        </div>

        <!-- 數據統計儀表板卡片 -->
        <div class="grid grid-cols-3 gap-4">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 text-center">
                <div class="text-xs text-gray-400 mb-1">總建檔學員</div>
                <div id="statTotalStudents" class="text-2xl font-bold text-gray-800">0</div>
            </div>
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 text-center">
                <div class="text-xs text-blue-500 mb-1">進行中（有剩餘堂數）</div>
                <div id="statActiveStudents" class="text-2xl font-bold text-blue-600">0</div>
            </div>
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 text-center">
                <div class="text-xs text-green-500 mb-1">已完課（堂數用盡）</div>
                <div id="statFinishedStudents" class="text-2xl font-bold text-green-600">0</div>
            </div>
        </div>

        <!-- 報名與排課表單 -->
        <div class="bg-white rounded-2xl shadow-md p-6">
            <h2 class="font-bold text-gray-800 text-base mb-4 pb-2 border-b">📝 新增學員與排定課程</h2>
            <form id="enrollmentForm" class="space-y-6">
                
                <!-- 區塊一：學員基本資料與總堂數 -->
                <div class="bg-blue-50 p-4 rounded-xl space-y-3 border border-blue-100">
                    <h3 class="font-bold text-blue-900 text-sm">1. 學員基本資料與購買堂數</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-medium text-gray-700 mb-1">學員姓名 *</label>
                            <input type="text" id="studentName" required placeholder="例如：王小明" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 text-sm bg-white">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-700 mb-1">聯絡電話 *</label>
                            <input type="tel" id="studentPhone" required placeholder="0912345678" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 text-sm bg-white">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-700 mb-1">購買總堂數 * (修改數字會自動產生對應排課欄位)</label>
                        <input type="number" id="purchasedLessons" min="1" max="30" value="3" required class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 text-sm bg-white font-bold text-blue-600">
                    </div>
                </div>

                <!-- 區塊二：動態產生各堂課的日期、時段與教練 -->
                <div class="bg-green-50 p-4 rounded-xl space-y-3 border border-green-100">
                    <h3 class="font-bold text-green-900 text-sm">2. 設定每一堂課的日期、時段與教練</h3>
                    <div id="scheduleRowsContainer" class="space-y-3">
                        <!-- 動態產生的排課列 -->
                    </div>
                </div>

                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition shadow">
                    💾 儲存學員資料並批次完成排課
                </button>
            </form>
        </div>

        <!-- 學員與堂數管理列表 -->
        <div class="bg-white rounded-2xl shadow-md p-6 space-y-4">
            <h3 class="font-bold text-gray-800 text-base pb-2 border-b">📋 現有學員與堂數追蹤列表</h3>
            <div id="studentListContainer" class="space-y-3">
                <!-- 動態顯示所有學員與剩餘堂數 -->
            </div>
        </div>

    </div>

    <script>
        // 取得預設日期格式字串 (YYYY-MM-DD)
        function getDefaultDate(addDays = 0) {
            const d = new Date();
            d.setDate(d.getDate() + addDays);
            return d.toISOString().split('T')[0];
        }

        // 動態生成指定堂數的排課輸入列
        function generateScheduleRows() {
            const count = parseInt(document.getElementById('purchasedLessons').value) || 1;
            const container = document.getElementById('scheduleRowsContainer');
            container.innerHTML = '';

            for (let i = 1; i <= count; i++) {
                const defaultDate = getDefaultDate(i - 1);

                const rowHTML = `
                    <div class="p-3 bg-white rounded-xl border border-green-200 shadow-sm space-y-2">
                        <div class="flex justify-between items-center">
                            <span class="font-bold text-green-800 text-xs bg-green-100 px-2 py-0.5 rounded">第 ${i} 堂課</span>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-2">
                            <div>
                                <label class="block text-[11px] text-gray-500 mb-0.5">上課日期</label>
                                <input type="date" name="lessonDate" value="${defaultDate}" required class="w-full p-2 border rounded-lg text-xs">
                            </div>
                            <div>
                                <label class="block text-[11px] text-gray-500 mb-0.5">上課時段</label>
                                <select name="lessonTime" required class="w-full p-2 border rounded-lg text-xs bg-white">
                                    <option value="09:00 - 10:30">09:00 - 10:30</option>
                                    <option value="10:30 - 12:00">10:30 - 12:00</option>
                                    <option value="14:00 - 15:30" selected>14:00 - 15:30</option>
                                    <option value="15:30 - 17:00">15:30 - 17:00</option>
                                    <option value="19:00 - 20:30">19:00 - 20:30</option>
                                    <option value="20:30 - 22:00">20:30 - 22:00</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-[11px] text-gray-500 mb-0.5">指派教練</label>
                                <select name="lessonCoach" class="w-full p-2 border rounded-lg text-xs bg-white">
                                    <option value="張教練">張教練</option>
                                    <option value="林教練">林教練</option>
                                    <option value="陳教練">陳教練</option>
                                </select>
                            </div>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', rowHTML);
            }
        }

        document.getElementById('purchasedLessons').addEventListener('input', generateScheduleRows);
        generateScheduleRows();

        // 渲染學員列表與上方統計數字
        function renderDashboard() {
            const students = JSON.parse(localStorage.getItem('studentsList') || '[]');
            
            // 計算統計數據
            let total = students.length;
            let active = 0;
            let finished = 0;

            const container = document.getElementById('studentListContainer');
            
            if (total === 0) {
                container.innerHTML = '<p class="text-gray-400 text-xs text-center py-4">目前尚無學員建檔紀錄</p>';
                document.getElementById('statTotalStudents').innerText = 0;
                document.getElementById('statActiveStudents').innerText = 0;
                document.getElementById('statFinishedStudents').innerText = 0;
                return;
            }

            let html = '';
            students.forEach((s, index) => {
                // 計算剩餘堂數（未點名/尚未消耗的堂數）
                const remaining = s.lessons.filter(l => !l.attended).length;
                const totalCount = s.lessons.length;

                if (remaining > 0) {
                    active++;
                } else {
                    finished++;
                }

                html += `
                    <div class="p-4 bg-gray-50 rounded-xl border border-gray-200 flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
                        <div>
                            <div class="flex items-center space-x-2">
                                <span class="font-bold text-gray-800 text-sm">${s.name}</span>
                                <span class="text-xs text-gray-500">(${s.phone})</span>
                                <span class="text-[10px] px-2 py-0.5 rounded-full ${remaining > 0 ? 'bg-blue-100 text-blue-700 font-bold' : 'bg-green-100 text-green-700 font-bold'}">
                                    ${remaining > 0 ? '進行中' : '已完課'}
                                </span>
                            </div>
                            <div class="text-xs text-gray-500 mt-1">
                                📊 購買總堂數：<span class="font-bold text-gray-700">${totalCount}</span> 堂 ｜ 剩餘可上：<span class="font-bold text-blue-600">${remaining}</span> 堂
                            </div>
                        </div>
                        <button onclick="deleteStudent(${s.id})" class="text-xs text-red-500 hover:text-red-700 bg-white border border-red-200 px-3 py-1 rounded-lg transition">
                            刪除學員
                        </button>
                    </div>
                `;
            });

            container.innerHTML = html;
            document.getElementById('statTotalStudents').innerText = total;
            document.getElementById('statActiveStudents').innerText = active;
            document.getElementById('statFinishedStudents').innerText = finished;
        }

        // 刪除學員功能
        function deleteStudent(id) {
            if (confirm('確定要刪除這位學員的資料嗎？')) {
                let students = JSON.parse(localStorage.getItem('studentsList') || '[]');
                students = students.filter(s => s.id !== id);
                localStorage.setItem('studentsList', JSON.stringify(students));
                renderDashboard();
            }
        }

        // 表單送出處理
        document.getElementById('enrollmentForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const name = document.getElementById('studentName').value;
            const phone = document.getElementById('studentPhone').value;
            const totalCount = parseInt(document.getElementById('purchasedLessons').value);

            const dateInputs = document.querySelectorAll('input[name="lessonDate"]');
            const timeSelects = document.querySelectorAll('select[name="lessonTime"]');
            const coachSelects = document.querySelectorAll('select[name="lessonCoach"]');

            const lessonsArr = [];
            for (let i = 0; i < dateInputs.length; i++) {
                lessonsArr.push({
                    lessonNo: i + 1,
                    date: dateInputs[i].value,
                    time: timeSelects[i].value,
                    coach: coachSelects[i].value,
                    attended: false // 預設未點名
                });
            }

            const newStudentRecord = {
                id: Date.now(),
                name: name,
                phone: phone,
                lessons: lessonsArr
            };

            let students = JSON.parse(localStorage.getItem('studentsList') || '[]');
            students.push(newStudentRecord);
            localStorage.setItem('studentsList', JSON.stringify(students));

            alert(`✅ 成功為 ${name} 建立資料，並排定共 ${totalCount} 堂課！`);
            
            // 重置表單
            document.getElementById('studentName').value = '';
            document.getElementById('studentPhone').value = '';
            document.getElementById('purchasedLessons').value = '3';
            generateScheduleRows();
            renderDashboard();
        });

        // 頁面載入時渲染儀表板與列表
        renderDashboard();
    </script>
</body>
</html>
