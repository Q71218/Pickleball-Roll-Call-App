<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學員報名與購課 - 場館人員系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen pb-12">
    <div class="max-w-md mx-auto bg-white min-h-screen shadow-lg flex flex-col">
        
        <div class="bg-blue-600 text-white p-4 flex items-center justify-between shadow">
            <a href="index.html" class="text-xs bg-blue-700 hover:bg-blue-800 px-3 py-1.5 rounded-lg transition">⬅ 返回選單</a>
            <span class="font-bold text-lg">🧑‍💼 學員報名與購課</span>
            <div class="w-16"></div>
        </div>

        <div class="p-4 flex-1 space-y-4">
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-1">學員姓名：</label>
                <input type="text" id="studentName" placeholder="例如：王小明" class="w-full border rounded-lg p-2.5 bg-gray-50 focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <div>
                <label class="block text-gray-700 text-sm font-bold mb-1">學員電話：</label>
                <input type="text" id="studentPhone" placeholder="例如：0912-345-678" class="w-full border rounded-lg p-2.5 bg-gray-50 focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <div>
                <label class="block text-gray-700 text-sm font-bold mb-1">購買堂數：</label>
                <input type="number" id="buyCount" value="10" class="w-full border rounded-lg p-2.5 bg-gray-50 focus:ring-2 focus:ring-blue-500 outline-none font-bold text-blue-600">
            </div>

            <div>
                <label class="block text-gray-700 text-sm font-bold mb-1">學員備註：</label>
                <textarea id="registerNote" rows="2" placeholder="例如：初學者、球拍自備..." class="w-full border rounded-lg p-2.5 bg-gray-50 focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
            </div>
        </div>

        <div class="p-4 bg-white border-t sticky bottom-0 shadow-inner">
            <button onclick="submitRegistration()" id="submitBtn" class="w-full bg-blue-600 text-white font-bold py-3.5 rounded-xl hover:bg-blue-700 transition shadow-md">
                確認送出並新增學員
            </button>
        </div>

    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwVA2usi9g9Nl62yIng7J87WHEqPnH0FOUSSp3wDaB-EUQLJVFUgCnY7QmuTRIwylpI/exec";

        function submitRegistration() {
            const name = document.getElementById('studentName').value;
            const phone = document.getElementById('studentPhone').value;
            const count = document.getElementById('buyCount').value;
            const note = document.getElementById('registerNote').value;
            const submitBtn = document.getElementById('submitBtn');

            if (!name) {
                alert('請填寫學員姓名！');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerText = '正在提交...';

            fetch(GAS_URL, {
                method: 'POST',
                body: JSON.stringify({ 
                    action: 'register',
                    name: name, 
                    phone: phone,
                    buyCount: count,
                    note: note
                })
            })
            .then(res => res.json())
            .then(res => {
                alert('🎉 學員建檔與購課成功！');
                location.reload();
            })
            .catch(err => {
                console.error(err);
                alert('連線失敗，請檢查網路！');
                submitBtn.disabled = false;
                submitBtn.innerText = '確認送出並新增學員';
            });
        }
    </script>
</body>
</html>
