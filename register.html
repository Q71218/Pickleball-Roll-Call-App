<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學員管理與購課 - 場館人員系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen pb-12">
    <div class="max-w-md mx-auto bg-white min-h-screen shadow-lg flex flex-col">
        
        <div class="bg-blue-600 text-white p-4 flex items-center justify-between shadow sticky top-0 z-10">
            <a href="index.html" class="text-xs bg-blue-700 hover:bg-blue-800 px-3 py-1.5 rounded-lg transition">⬅ 返回選單</a>
            <span class="font-bold text-lg" id="formTitle">🧑‍💼 學員管理中心</span>
            <button onclick="resetForm()" class="text-xs bg-blue-700 hover:bg-blue-800 px-2 py-1.5 rounded-lg transition">重設</button>
        </div>

        <div class="p-4 flex-1 space-y-4">
            <!-- 表單區塊 -->
            <div class="bg-blue-50 p-4 rounded-2xl border border-blue-100 space-y-3">
                <div class="font-bold text-blue-900 text-sm" id="formSubtitle">✨ 新增學員與購課</div>
                <input type="hidden" id="editStudentId" value="">

                <div>
                    <label class="block text-gray-700 text-xs font-bold mb-1">學員姓名：</label>
                    <input type="text" id="studentName" placeholder="例如：王小明" class="w-full border rounded-lg p-2 bg-white text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>

                <div>
                    <label class="block text-gray-700 text-xs font-bold mb-1">學員電話：</label>
                    <input type="text" id="studentPhone" placeholder="例如：0912-345-678" class="w-full border rounded-lg p-2 bg-white text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>

                <div>
                    <label class="block text-gray-700 text-xs font-bold mb-1">購買總堂數：</label>
                    <input type="number" id="buyCount" value="10" class="w-full border rounded-lg p-2 bg-white text-sm font-bold text-blue-600 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>

                <div>
                    <label class="block text-gray-700 text-xs font-bold mb-1">學員備註：</label>
                    <textarea id="registerNote" rows="1" placeholder="例如：初學者..." class="w-full border rounded-lg p-2 bg-white text-sm focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
                </div>

                <div class="flex space-x-2 pt-1">
                    <button onclick="submitForm()" id="submitBtn" class="flex-1 bg-blue-600 text-white font-bold py-2.5 rounded-xl hover:bg-blue-700 transition shadow-sm text-sm">
                        確認新增學員
                    </button>
                    <button onclick="resetForm()" id="cancelEditBtn" class="hidden px-4 bg-gray-300 text-gray-700 font-bold py-2.5 rounded-xl hover:bg-gray-400 transition text-sm">
                        取消
                    </button>
                </div>
            </div>

            <hr class="my-2">

            <!-- 學員清單與搜尋區塊 -->
            <div>
                <div class="flex justify-between items-center mb-2">
                    <span class="font-bold text-gray-700 text-sm">📋 現有學員清單</span>
                    <span id="studentCount" class="text-xs text-gray-400">載入中...</span>
                </div>

                <!-- 搜尋框 -->
                <div class="mb-3">
                    <input type="text" id="searchInput" oninput="filterStudents()" placeholder="🔍 輸入姓名或電話快速搜尋..." class="w-full border rounded-xl p-2 bg-gray-50 text-xs focus:ring-2 focus:ring-blue-500 outline-none">
                </div>

                <div id="studentListContainer" class="space-y-2 max-h-[400px] overflow-y-auto pr-1">
                    <p class="text-sm text-gray-400 text-center py-4">正在讀取學員資料...</p>
                </div>
            </div>
        </div>

    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwVA2usi9g9Nl62yIng7J87WHEqPnH0FOUSSp3wDaB-EUQLJVFUgCnY7QmuTRIwylpI/exec";
        let cachedStudents = [];

        window.onload = function() {
            loadStudents();
        };

        function loadStudents() {
            fetch(GAS_URL)
            .then(res => res.json())
            .then(data => {
                cachedStudents = data.students || [];
                renderStudentList(cachedStudents);
            })
            .catch(err => {
                console.error(err);
                document.getElementById('studentListContainer').innerHTML = '<p class="text-sm text-red-400 text-center py-4">載入學員清單失敗。</p>';
            });
        }

        function filterStudents() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const filtered = cachedStudents.filter(stu => {
                const name = String(stu['姓名'] || '').toLowerCase();
                const phone = String(stu['電話'] || '').toLowerCase();
                return name.includes(keyword) || phone.includes(keyword);
            });
            renderStudentList(filtered);
        }

        function renderStudentList(students) {
            const container = document.getElementById('studentListContainer');
            document.getElementById('studentCount').innerText = `共 ${students.length} 位學員`;

            if (students.length === 0) {
                container.innerHTML = '<p class="text-sm text-gray-400 text-center py-4">沒有找到符合的學員。</p>';
                return;
            }

            let html = '';
            students.forEach((stu) => {
                html += `
                    <div class="p-3 bg-gray-50 rounded-xl border flex items-center justify-between text-xs">
                        <div class="space-y-0.5">
                            <div class="font-bold text-gray-800 text-sm">${stu['姓名']} <span class="text-blue-600 font-normal">(剩餘: ${stu['剩餘堂數'] ?? 0}堂)</span></div>
                            <div class="text-gray-500">電話: ${stu['電話'] || '未填'} | ID: ${stu['學員ID']}</div>
                            <div class="text-gray-400">備註: ${stu['學員備註'] || '無'}</div>
                        </div>
                        <div class="flex flex-col space-y-1.5">
                            <button onclick="prepareEdit('${stu['學員ID']}')" class="px-3 py-1 bg-amber-500 text-white rounded-lg hover:bg-amber-600 transition font-bold shadow-sm">
                                編輯
                            </button>
                            <button onclick="deleteStudent('${stu['學員ID']}', '${stu['姓名']}')" class="px-3 py-1 bg-red-500 text-white rounded-lg hover:bg-red-600 transition font-bold shadow-sm">
                                刪除
                            </button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function prepareEdit(studentId) {
            const stu = cachedStudents.find(s => String(s['學員ID']) === String(studentId));
            if (!stu) return;

            document.getElementById('editStudentId').value = stu['學員ID'];
            document.getElementById('studentName').value = stu['姓名'] || '';
            document.getElementById('studentPhone').value = stu['電話'] || '';
            document.getElementById('buyCount').value = stu['購買堂數'] || 0;
            document.getElementById('registerNote').value = stu['學員備註'] || '';

            document.getElementById('formSubtitle').innerText = '✏️ 修改學員資料 (ID: ' + studentId + ')';
            document.getElementById('submitBtn').innerText = '儲存修改';
            document.getElementById('submitBtn').className = "flex-1 bg-amber-600 text-white font-bold py-2.5 rounded-xl hover:bg-amber-700 transition shadow-sm text-sm";
            document.getElementById('cancelEditBtn').classList.remove('hidden');

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetForm() {
            document.getElementById('editStudentId').value = '';
            document.getElementById('studentName').value = '';
            document.getElementById('studentPhone').value = '';
            document.getElementById('buyCount').value = '10';
            document.getElementById('registerNote').value = '';

            document.getElementById('formSubtitle').innerText = '✨ 新增學員與購課';
            document.getElementById('submitBtn').innerText = '確認新增學員';
            document.getElementById('submitBtn').className = "flex-1 bg-blue-600 text-white font-bold py-2.5 rounded-xl hover:bg-blue-700 transition shadow-sm text-sm";
            document.getElementById('cancelEditBtn').classList.add('hidden');
        }

        function deleteStudent(studentId, name) {
            if (!confirm(`確定要刪除學員「${name}」嗎？此動作無法復原！`)) {
                return;
            }

            fetch(GAS_URL, {
                method: 'POST',
                body: JSON.stringify({
                    action: 'deleteStudent',
                    studentId: studentId
                })
            })
            .then(res => res.json())
            .then(res => {
                if (res.status === 'success') {
                    alert('🗑️ 已經成功刪除學員！');
                    loadStudents();
                } else {
                    alert('刪除失敗');
                }
            })
            .catch(err => {
                console.error(err);
                alert('連線失敗！');
            });
        }

        function submitForm() {
            const editId = document.getElementById('editStudentId').value;
            const name = document.getElementById('studentName').value;
            const phone = document.getElementById('studentPhone').value;
            const buyCount = document.getElementById('buyCount').value;
            const note = document.getElementById('registerNote').value;
            const submitBtn = document.getElementById('submitBtn');

            if (!name) {
                alert('請填寫學員姓名！');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerText = '處理中...';

            const actionType = editId ? 'updateStudent' : 'register';
            const payload = {
                action: actionType,
                studentId: editId,
                name: name,
                phone: phone,
                buyCount: buyCount,
                note: note
            };

            fetch(GAS_URL, {
                method: 'POST',
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(res => {
                if (res.status === 'success') {
                    alert(editId ? '🎉 學員資料修改成功！' : '🎉 新增學員成功！');
                    resetForm();
                    loadStudents();
                } else {
                    alert('操作失敗');
                }
                submitBtn.disabled = false;
            })
            .catch(err => {
                console.error(err);
                alert('連線失敗！');
                submitBtn.disabled = false;
            });
        }
    </script>
</body>
</html>
